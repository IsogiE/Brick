[package]
name = "brick"
version = "0.5.3"
description = "Advance"
authors = ["Advance Raid Tools"]
license = "MIT"
repository = "https://github.com/IsogiE/Brick"
edition = "2021"

[dependencies]
auto-launch = "0.5"
base64 = "0.22"
ed25519-dalek = "2"
eframe = { version = "=0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "json", "rustls-tls"] }
rfd = "0.16"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
wry = { version = "=0.55.1", default-features = false, features = ["os-webview", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
ksni = { version = "0.3", features = ["blocking"] }
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland"] }
x11rb = "0.13"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
winit = { version = "=0.30.13", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
