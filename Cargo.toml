[package]
name = "brick"
version = "0.3.5"
description = "Advance"
authors = ["Advance Raid Tools"]
license = "All rights reserved"
repository = "https://github.com/IsogiE/AdvanceRaidTools"
edition = "2021"

[dependencies]
auto-launch = "0.5"
base64 = "0.22"
ed25519-dalek = "2"
eframe = { version = "=0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "json", "rustls-tls"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
