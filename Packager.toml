name = "brick"
product-name = "Brick"
identifier = "dev.isogi.brick"
version = "0.4.0"
authors = ["Advance Raid Tools"]
publisher = "Advance"
description = "Advance Raid Tools"
long-description = "Small in-house updater for the Advance Raid Tools guild addon package."
homepage = "https://github.com/IsogiE/Brick"
category = "Utility"
out-dir = "dist/packages"
binaries-dir = "target/release"
before-packaging-command = "cargo build --release"
binaries = [{ path = "brick", main = true }]
icons = ["src/assets/brick.ico", "src/assets/brick.png"]
formats = ["appimage"]
resources = ["LICENSE"]

[linux]
generate-desktop-entry = true

[deb]
depends = ["libgtk-3-0 | libgtk-3-0t64", "libwebkit2gtk-4.1-0", "gstreamer1.0-plugins-good", "gstreamer1.0-plugins-bad", "gstreamer1.0-libav"]

[pacman]
depends = ["gtk3", "webkit2gtk-4.1", "gst-plugins-good", "gst-plugins-bad", "gst-libav"]

[appimage]
# WebKit's helper processes and GStreamer modules must match their system
# libraries. Keep this complete runtime outside the AppImage.
excluded-libraries = [
  "libwebkit2gtk-4.1*", "libjavascriptcoregtk-4.1*", "libsoup-3.0*",
  "libgtk-3*", "libgdk-3*", "libgdk_pixbuf-2.0*", "libatk-1.0*",
  "libglib-2.0*", "libgio-2.0*", "libgobject-2.0*", "libgmodule-2.0*", "libgthread-2.0*",
  "libgst*", "libpango*", "libcairo*",
]

[nsis]
installer-mode = "currentUser"
template = "packaging/windows/installer.nsi"
preinstall-section = '''
Section ForceCurrentUserInstallDir
  !if "${INSTALLMODE}" != "currentUser"
    Goto force_current_user_install_dir_done
  !endif
  StrCpy $INSTDIR "$LOCALAPPDATA\${PRODUCTNAME}"
  Call RestorePreviousInstallLocation
force_current_user_install_dir_done:
SectionEnd
'''

[windows]
allow-downgrades = false
