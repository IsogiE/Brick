services:
  api:
    networks: [default, timestamp-worker]
    environment:
      BRICK_TIMESTAMP_WORKER: "true"
      BRICK_TIMESTAMP_TOKEN_FILE: /run/secrets/timestamp_worker_token
    secrets:
      - timestamp_worker_token
  timestamps:
    networks: [timestamp-worker, timestamp-egress]
    build:
      context: ..
      dockerfile: presence/Dockerfile.timestamp
    restart: unless-stopped
    init: true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "20"
    tmpfs:
      - /tmp:size=134217728,uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev
    environment:
      BRICK_TIMESTAMP_QUEUE_URL: http://api:8081/
      BRICK_TIMESTAMP_TOKEN_FILE: /run/secrets/timestamp_worker_token
      BRICK_TIMESTAMP_SCRATCH_DIR: /scratch/jobs
    secrets:
      - timestamp_worker_token
    volumes:
      - brick-timestamp-scratch:/scratch
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://api:8081/').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
secrets:
  timestamp_worker_token:
    file: ./secrets/timestamp_worker_token
networks:
  timestamp-worker:
    internal: true
  timestamp-egress:
volumes:
  brick-timestamp-scratch:
