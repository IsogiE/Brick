# Use alongside compose.yaml after creating the private files on the server:
# docker compose -f compose.yaml -f compose.streams.yaml up -d --build
services:
  api:
    environment:
      BRICK_PLAYER_ORIGIN: https://${BRICK_DOMAIN:?}
      TWITCH_CLIENT_ID_FILE: /run/secrets/twitch_client_id
      TWITCH_CLIENT_SECRET_FILE: /run/secrets/twitch_client_secret
      YOUTUBE_API_KEY_FILE: /run/secrets/youtube_api_key
    secrets:
      - twitch_client_id
      - twitch_client_secret
      - youtube_api_key

secrets:
  twitch_client_id:
    file: ./secrets/twitch_client_id
  twitch_client_secret:
    file: ./secrets/twitch_client_secret
  youtube_api_key:
    file: ./secrets/youtube_api_key
