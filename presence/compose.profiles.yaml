# Mount a separately generated 32-byte hex encryption key as a Docker secret.
# Keep this key when moving the encrypted profile data to another server.
services:
  api:
    environment:
      PROFILE_ENCRYPTION_KEY_FILE: /run/secrets/profile_encryption_key
    secrets:
      - profile_encryption_key

secrets:
  profile_encryption_key:
    file: ./secrets/profile_encryption_key
