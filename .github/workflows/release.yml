name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to publish, for example 0.1.0'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
            cache-formats: nsis
          - os: ubuntu-22.04
            formats: appimage,deb,pacman
            cache-formats: appimage-deb-pacman
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-packager.exe
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: brick-${{ runner.os }}-${{ matrix.cache-formats }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            brick-${{ runner.os }}-${{ matrix.cache-formats }}-
            brick-${{ runner.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev libssl-dev librsvg2-dev patchelf

      - name: Install Cargo Packager
        shell: bash
        run: |
          if command -v cargo-packager >/dev/null 2>&1; then
            cargo-packager --version
          else
            cargo install cargo-packager --locked
          fi

      - name: Download AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appimage-runtime"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/appimage-runtime/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "LDAI_RUNTIME_FILE=$RUNNER_TEMP/appimage-runtime/runtime-x86_64" >> "$GITHUB_ENV"

      - name: Configure version
        env:
          BRICK_APP_VERSION: ${{ inputs.version }}
        run: node scripts/set-app-version.mjs

      - name: Verify release keys
        env:
          BRICK_ADDON_PUBLIC_KEY_B64: ${{ secrets.BRICK_ADDON_PUBLIC_KEY_B64 }}
        run: node -e "if (!process.env.BRICK_ADDON_PUBLIC_KEY_B64) throw new Error('BRICK_ADDON_PUBLIC_KEY_B64 is required.');"

      - name: Verify Discord login config
        env:
          BRICK_DISCORD_CLIENT_ID: ${{ vars.BRICK_DISCORD_CLIENT_ID }}
        run: node -e "if (!/^[0-9]+$/.test(process.env.BRICK_DISCORD_CLIENT_ID || '')) throw new Error('BRICK_DISCORD_CLIENT_ID repository variable is required.');"

      - name: Verify presence API config
        env:
          BRICK_PRESENCE_API_URL: ${{ vars.BRICK_PRESENCE_API_URL }}
        run: node -e "const url = process.env.BRICK_PRESENCE_API_URL || ''; const parsed = new URL(url); if (parsed.protocol !== 'https:') throw new Error('BRICK_PRESENCE_API_URL repository variable must be an https URL.');"

      - name: Build Windows binary for signing
        if: runner.os == 'Windows' && vars.BRICK_WINDOWS_SIGNING == 'artifact-signing'
        env:
          BRICK_ADDON_PUBLIC_KEY_B64: ${{ secrets.BRICK_ADDON_PUBLIC_KEY_B64 }}
          BRICK_DISCORD_CLIENT_ID: ${{ vars.BRICK_DISCORD_CLIENT_ID }}
          BRICK_DISCORD_REDIRECT_URI: ${{ vars.BRICK_DISCORD_REDIRECT_URI }}
          BRICK_PRESENCE_API_URL: ${{ vars.BRICK_PRESENCE_API_URL }}
          RUSTFLAGS: -D warnings
        run: cargo build --release

      - name: Azure login for Windows signing
        if: runner.os == 'Windows' && vars.BRICK_WINDOWS_SIGNING == 'artifact-signing'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binary
        if: runner.os == 'Windows' && vars.BRICK_WINDOWS_SIGNING == 'artifact-signing'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\release\brick.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Prepare signed Windows package config
        if: runner.os == 'Windows' && vars.BRICK_WINDOWS_SIGNING == 'artifact-signing'
        shell: pwsh
        run: |
          Get-Content Packager.toml |
            Where-Object { $_ -notmatch '^before-packaging-command\s*=' } |
            Set-Content Packager.signed.toml

      - name: Build package
        if: runner.os != 'Windows' || vars.BRICK_WINDOWS_SIGNING != 'artifact-signing'
        env:
          BRICK_ADDON_PUBLIC_KEY_B64: ${{ secrets.BRICK_ADDON_PUBLIC_KEY_B64 }}
          BRICK_DISCORD_CLIENT_ID: ${{ vars.BRICK_DISCORD_CLIENT_ID }}
          BRICK_DISCORD_REDIRECT_URI: ${{ vars.BRICK_DISCORD_REDIRECT_URI }}
          BRICK_PRESENCE_API_URL: ${{ vars.BRICK_PRESENCE_API_URL }}
          NO_STRIP: 1
          RUSTFLAGS: -D warnings
        run: cargo packager --release --formats ${{ matrix.formats }}

      - name: Build signed Windows package
        if: runner.os == 'Windows' && vars.BRICK_WINDOWS_SIGNING == 'artifact-signing'
        env:
          BRICK_DISCORD_CLIENT_ID: ${{ vars.BRICK_DISCORD_CLIENT_ID }}
          BRICK_DISCORD_REDIRECT_URI: ${{ vars.BRICK_DISCORD_REDIRECT_URI }}
          BRICK_PRESENCE_API_URL: ${{ vars.BRICK_PRESENCE_API_URL }}
          NO_STRIP: 1
          RUSTFLAGS: -D warnings
        run: cargo packager --config Packager.signed.toml --formats ${{ matrix.formats }}

      - name: Verify Windows NSIS installer policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1 -RunInstallSmoke

      - name: Sign Windows NSIS installer
        if: runner.os == 'Windows' && vars.BRICK_WINDOWS_SIGNING == 'artifact-signing'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist\packages
          files-folder-filter: '*.exe'
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: brick-${{ runner.os }}
          path: dist/packages/**

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Verify app feed signing key
        env:
          BRICK_ADDON_PRIVATE_KEY_B64: ${{ secrets.BRICK_ADDON_PRIVATE_KEY_B64 }}
        run: node -e "if (!process.env.BRICK_ADDON_PRIVATE_KEY_B64) throw new Error('BRICK_ADDON_PRIVATE_KEY_B64 is required.');"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.BRICK_RELEASE_TOKEN }}
          BRICK_APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          repo="IsogiE/Brick-Releases"
          if [[ -n "${BRICK_APP_VERSION:-}" ]]; then
            tag="v${BRICK_APP_VERSION#v}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 || gh release create "$tag" --repo "$repo" --title "Brick $tag" --notes ""
          while IFS= read -r -d '' file; do
            gh release upload "$tag" "$file" --repo "$repo" --clobber
          done < <(find release-assets -type f -print0)

      - name: Publish app update feed
        env:
          GH_TOKEN: ${{ secrets.BRICK_RELEASE_TOKEN }}
          BRICK_APP_VERSION: ${{ inputs.version }}
          BRICK_ADDON_PRIVATE_KEY_B64: ${{ secrets.BRICK_ADDON_PRIVATE_KEY_B64 }}
          BRICK_RELEASE_ASSETS_DIR: release-assets
        run: node scripts/publish-app-feed.mjs
