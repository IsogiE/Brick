name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && (vars.BRICK_WINDOWS_RUNNER || '"windows-latest"') || (vars.BRICK_LINUX_RUNNER || '"ubuntu-24.04"')) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Check Linux release runtime availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-runtime.mjs

      - name: Check Pacman recipe configuration
        if: runner.os == 'Linux'
        run: |
          python3 packaging/linux/check-pacman.py
          python3 packaging/linux/check-pacman.test.py

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Brick does not use the runner's optional Chrome package repository.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev libssl-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gnome-keyring xvfb squashfs-tools bubblewrap ffmpeg

      - name: Install the verified Linux release runtime
        if: runner.os == 'Linux'
        run: sudo --preserve-env=HTTP_PROXY,HTTPS_PROXY,NO_PROXY,http_proxy,https_proxy,no_proxy python3 packaging/linux/install-runtime.py

      - name: Allow the native player sandbox in the disposable Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0) == 1 ]]; then
            # WebKit still uses Bubblewrap isolation; Ubuntu requires an explicit
            # userns allowance for this system helper in the disposable test VM.
            sudo tee /etc/apparmor.d/brick-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile brick-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/brick-ci-bwrap
          fi

      - name: Test the installed release runtime before compiling Brick
        if: runner.os == 'Linux'
        run: python3 packaging/linux/test-runtime.py

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          rustfmt --check --edition 2021 src/app_modules.rs
          rustfmt --check --edition 2021 packaging/linux/apprun.rs

      - name: Verify renderer backport provenance
        if: runner.os == 'Linux'
        run: python3 scripts/verify-eframe-backport.py

      - name: Check
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo check --locked

      - name: Test player scripts
        if: runner.os == 'Linux'
        run: node --test tests/*.test.mjs

      - name: Test AppImage sandbox relocation and startup
        if: runner.os == 'Linux'
        run: |
          node --test packaging/linux/*.test.mjs
          python3 packaging/linux/install-runtime.test.py

      - name: Test addon feed publication decisions
        if: runner.os == 'Linux'
        run: node --test scripts/publish-*.test.mjs

      - name: Test
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo test --locked

      - name: Test GLib pointer backport with optimization
        if: runner.os == 'Linux'
        run: cargo test --locked --config 'profile.dev.package.glib.opt-level=3' --test glib_backport

      - name: Test native player resizing
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: '-D warnings'
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a dbus-run-session -- cargo test --locked --test native_player -- resize

      - name: Test native playback overlays
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: '-D warnings'
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a dbus-run-session -- cargo test --locked --test native_player -- overlays

      - name: Test native fullscreen transitions
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: '-D warnings'
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a dbus-run-session -- cargo test --locked --test native_player -- fullscreen

      - name: Test Windows signature verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/sync-signing-clock.test.ps1
          ./scripts/prepare-certum-action.test.ps1
          ./scripts/sign-windows.test.ps1
          ./scripts/sign-windows-uninstaller.test.ps1
          # NSIS must use the same PowerShell edition as the signing steps.
          pwsh -NoProfile -ExecutionPolicy Bypass -Command 'Get-Item Cert:\CurrentUser | Out-Null'
          if ($LASTEXITCODE -ne 0) { throw 'The NSIS signing shell cannot access the certificate store.' }

      - name: Test updater against a real signed Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: '-D warnings -C target-feature=+crt-static'
        run: |
          $env:BRICK_SIGNED_INSTALLER_FIXTURE = Join-Path $env:RUNNER_TEMP 'brick-signed-fixture.exe'
          Invoke-WebRequest 'https://github.com/IsogiE/Brick-Releases/releases/download/v0.5.2/brick_0.5.2_x64-setup.exe' -OutFile $env:BRICK_SIGNED_INSTALLER_FIXTURE
          if ((Get-FileHash $env:BRICK_SIGNED_INSTALLER_FIXTURE -Algorithm SHA256).Hash -ne '22a6b59453e70351a5fd255c1c1f96d3795494dfb2565d85bf7b80ebbb63d914') { throw 'The public signing fixture has changed.' }
          cargo test --locked authenticode_accepts_brick_and_rejects_tampering_and_other_publishers -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Runtime installer signature verification failed.' }

      - name: Test Linux keyring storage
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: '-D warnings'
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          export XDG_CONFIG_HOME="$test_dir/config"
          export XDG_DATA_HOME="$test_dir/data"
          export XDG_CACHE_HOME="$test_dir/cache"
          export XDG_RUNTIME_DIR="$test_dir/runtime"
          unset GNOME_KEYRING_CONTROL GNOME_KEYRING_PID DBUS_SESSION_BUS_ADDRESS
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR/keyring"
          chmod 700 "$XDG_RUNTIME_DIR" "$XDG_RUNTIME_DIR/keyring"
          dbus-run-session -- bash -euo pipefail <<'KEYRING_TEST'
          # --unlock can return before the Secret Service is ready. Keep the
          # daemon attached to this test session and wait for the unlocked store.
          printf '%s' 'brick-test-password' | gnome-keyring-daemon --foreground --unlock --components=secrets --control-directory="$XDG_RUNTIME_DIR/keyring" >"$XDG_RUNTIME_DIR/keyring.log" 2>&1 &
          keyring_pid=$!
          trap 'kill "$keyring_pid" 2>/dev/null || true; wait "$keyring_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..100}; do
            if ! kill -0 "$keyring_pid" 2>/dev/null; then
              cat "$XDG_RUNTIME_DIR/keyring.log"
              exit 1
            fi
            owner="$(gdbus call --session --timeout 1 --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.NameHasOwner org.freedesktop.secrets 2>/dev/null || true)"
            if [[ "$owner" == '(true,)' ]]; then
              locked="$(gdbus call --session --timeout 1 --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets/aliases/default --method org.freedesktop.DBus.Properties.Get org.freedesktop.Secret.Collection Locked 2>/dev/null || true)"
              if [[ "$locked" == '(<false>,)' ]]; then
                ready=1
                break
              fi
            fi
            sleep 0.1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$XDG_RUNTIME_DIR/keyring.log"
            echo 'The isolated Secret Service did not expose an unlocked default collection.' >&2
            exit 1
          fi
          cargo test --locked linux_keyring_roundtrip -- --ignored --test-threads=1
          KEYRING_TEST
          DBUS_SESSION_BUS_ADDRESS="unix:path=$test_dir/no-such-bus" cargo test --locked linux_keyring_failure -- --ignored --test-threads=1

      - name: Test isolated Linux device reset
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: '-D warnings'
        run: |
          cargo test --locked --bin brick --no-run --message-format=json > "$RUNNER_TEMP/brick-erasure-artifacts.json"
          # Namespace setup needs privilege under the runner's user-map policy.
          # The helper maps to a non-root fixture user and drops all capabilities.
          sudo unshare --net -- \
            python3 scripts/test-local-erasure.py --isolated-network --privileged-setup \
            --cargo-artifacts "$RUNNER_TEMP/brick-erasure-artifacts.json" \
            --scratch-parent "$RUNNER_TEMP"

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo build --release --locked

      - name: Build isolated Windows interactive smoke tests
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: '-D warnings -C target-feature=+crt-static'
          BRICK_PRESENCE_API_URL: 'http://127.0.0.1:18083'
        run: cargo test --locked --bin brick --no-run

      - name: Build native rendering regression
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: '-D warnings -C target-feature=+crt-static'
        run: |
          cargo test --locked --test native_rendering --test native_window_geometry --no-run

      - name: Retain Windows native test binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: brick-windows-native-tests
          path: |
            target/debug/deps/brick-*.exe
            target/debug/deps/native_rendering-*.exe
            target/debug/deps/native_window_geometry-*.exe
          if-no-files-found: error
          retention-days: 7
