name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Brick does not use the runner's optional Chrome package repository.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev libssl-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gnome-keyring xvfb

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Check
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'Linux'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Test presence API and player scripts
        if: runner.os == 'Linux'
        run: node --test presence/*.test.mjs tests/*.test.mjs

      - name: Test AppImage sandbox relocation
        if: runner.os == 'Linux'
        run: node --test packaging/linux/bwrap-wrapper.test.mjs

      - name: Test addon feed publication decisions
        if: runner.os == 'Linux'
        run: node --test scripts/publish-addon-feed.test.mjs

      - name: Test
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo test

      - name: Test native player resizing
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: '-D warnings'
        run: xvfb-run -a cargo test --locked stream_player::resize::tests::native_player_viewport_shrinks_for_compare_and_grows_for_single_view -- --exact --ignored --test-threads=1

      - name: Test Windows signature verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/sign-windows.test.ps1
          ./scripts/sign-windows-uninstaller.test.ps1

      - name: Test Linux keyring storage
        if: runner.os == 'Linux'
        run: |
          test_dir="$(mktemp -d)"
          export XDG_DATA_HOME="$test_dir/data"
          export XDG_RUNTIME_DIR="$test_dir/runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- sh -ec '
            printf "%s" "brick-test-password" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked linux_keyring_roundtrip -- --ignored
          '
          DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/brick-no-such-bus cargo test --locked linux_keyring_failure -- --ignored

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo build --release
