name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev libssl-dev librsvg2-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Check
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo check

      - name: Test addon feed publication decisions
        if: runner.os == 'Linux'
        run: node --test scripts/publish-addon-feed.test.mjs

      - name: Test
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo test

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo build --release
