version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      webview-windows-bindings:
        patterns:
          - wry
          - webview2-com
          - windows
  - package-ecosystem: cargo
    directory: /presence/reader
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /presence
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /presence
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /presence/proxy
    schedule:
      interval: weekly
