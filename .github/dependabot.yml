version: 2
updates:
  - package-ecosystem: github-actions
    # Review dependency updates during active development.
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: cargo
    # Review dependency updates during active development.
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    directory: /
    schedule:
      interval: weekly
    groups:
      webview-windows-bindings:
        patterns:
          - wry
          - webview2-com
          - windows
